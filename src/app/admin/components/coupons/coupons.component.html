<div class="conatainer" style="padding: 30px;">
           <mat-card>
            <mat-card-content>
                <table mat-table [dataSource]="coupons" class="mat-elevation-z8">
                    <ng-container matColumnDef="id">
                          <th mat-header-cell *matHeaderCellDef>Coupon ID</th>  
                          <td mat-cell *matCellDef="let coupon"> {{coupon.id}}</td>
                    </ng-container>

                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef>Name</th>  
                        <td mat-cell *matCellDef="let coupon"> {{coupon.name}}</td>
                    </ng-container>

                  <ng-container matColumnDef="discount">
                    <th mat-header-cell *matHeaderCellDef>Discount</th>  
                    <td mat-cell *matCellDef="let coupon"> {{coupon.discount}}%</td>
                  </ng-container>

                 <ng-container matColumnDef="code">
                    <th mat-header-cell *matHeaderCellDef>Code</th>  
                    <td mat-cell *matCellDef="let coupon"> {{coupon.code}}</td>
                 </ng-container>

                 <ng-container matColumnDef="expirationDate">
                    <th mat-header-cell *matHeaderCellDef>Expiration date </th>  
                    <td mat-cell *matCellDef="let coupon"> {{coupon.expirationDate | date: 'dd/MM/yyyy'}}</td>
                 </ng-container>
                 <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef>Actions</th>
                    <td mat-cell *matCellDef="let coupon">
                        <button mat-stroked-button color="primary" [routerLink]="'/admin/coupon/'+coupon.id">Edit</button>
                        <button mat-stroked-button color="warn" (click)="deleteCoupon(coupon)">Delete</button>
                    </td>
                 </ng-container>
                  <tr mat-header-row *matHeaderRowDef="columns"></tr>
                  <tr mat-row *matRowDef="let row; columns: columns"></tr>
                </table>
            </mat-card-content>
           </mat-card>
</div>
