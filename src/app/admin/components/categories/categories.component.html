<div style="padding: 30px;">
    <mat-card>
        <mat-card-content>
            <button mat-raised-button color="primary" routerLink="/admin/category">Add category</button>
            <table mat-table [dataSource]="categories" class="mat-elevation-z8">
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Name</th>
                    <td mat-cell *matCellDef="let category">{{category.name}}</td>
                </ng-container>

                <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef>Description</th>
                    <td mat-cell *matCellDef="let category">{{category.description}}</td>
                </ng-container>

                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef>Actions</th>
                    <td mat-cell *matCellDef="let category">
                        <button mat-stroked-button color="primary" [routerLink]="'/admin/category/'+category.id">Edit</button>
                        <button mat-stroked-button color="warn" (click)="deleteCategory(category)">Delete</button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="columns"></tr>
                <tr mat-row *matRowDef="let row; columns: columns"></tr>
            </table>
        </mat-card-content>
    </mat-card>
</div>
