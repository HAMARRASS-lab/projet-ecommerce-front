<div class="container">
   <h2>{{categoryId ? 'Edit category' : 'Add category'}}</h2>
   <form [formGroup]="categoryForm" (ngSubmit)="saveCategory()">
      
       <mat-form-field appearance="outline" class="form-field">
        <mat-label>Name</mat-label>
        <input matInput type="text" placeholder="Name" formControlName="name"/>
        <mat-error *ngIf="categoryForm.get('name')?.hasError('required')">This input required</mat-error>
       </mat-form-field>
       <mat-form-field appearance="outline" class="form-field">
        <mat-label>Description</mat-label>
        <input matInput type="text" placeholder="Description" formControlName="description"/>
        <mat-error *ngIf="categoryForm.get('description')?.hasError('required')">This input required</mat-error>
       </mat-form-field>

       <button mat-raised-button color="primary" type="submit">{{categoryId ? 'Save changes' : 'Add category'}}</button>
   </form>

</div>
