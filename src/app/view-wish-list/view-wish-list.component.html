<p class="empty-wishlist" *ngIf="loaded && products.length === 0">Your wishlist is empty.</p>
<div class="center-container">
    <div class="product-card"  *ngFor="let product of products">
     <div class="product-img">
        <img [src]="product.processedImg" *ngIf="product.processedImg" alt="{{product.productName}} Image" >
     </div>
     <div class="product-details">
        <h2>{{product.productName}}</h2>
        <p class="description">{{product.productDescription}}</p>
        <p class="price">Price: ${{product.price}}</p>
        <button mat-stroked-button color="warn" (click)="remove(product.id)">Remove</button>
     </div>
    </div>
</div>
